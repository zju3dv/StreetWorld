[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streetworld"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "lllcccfff", email = "7802220128@csu.edu.cn" },
    { name = "Jesse Senior", email = "jessesenior@outlook.com" },
]
requires-python = ">=3.10"
version = "0.0.1"
dependencies = [
    "addict",
    "cuda-python<=12.8",
    "fast_gauss @ git+ssh://git@github.com/lllcccfff/fast-gauss-paral.git@1ad24f1f2fbb4cc145557fb83963483a66b214ec",
    "fastapi",
    "gymnasium",
    "grpcio",
    "grpcio-tools",
    "lxml",
    "matplotlib",
    "mediapy",
    "nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git",
    "opencv-python-headless",
    "panda3d",
    "pydantic",
    "pygame",
    "PyOpenGL",
    "PyOpenGL_accelerate",
    "protobuf",
    "PyYAML",
    "rich",
    "scipy",
    "shapely",
    "st-renderer @ git+ssh://git@github.com/lllcccfff/st-renderer.git@457559622c7451c11e5e16ea73195da56481013b",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "trajdata @ git+ssh://git@github.com/lllcccfff/trajdata.git@5ce3b86e1442ca216584b2c89e244d210a407edb",
    "trimesh",
    "uvicorn",
    "websockets<14",
    "pyglm",
    "gsplat==1.5.3",
    "plyfile==1.1.3"
]

[dependency-groups]
build = ["setuptools>=68", "wheel", "ninja"]

[tool.setuptools]
packages = [
    "streetworld",
    "streetworld.misc",
    "submodules.nurec_interface",
    "submodules.nurec_interface.nre",
    "submodules.nurec_interface.nre.grpc",
    "submodules.nurec_interface.nre.grpc.protos",
]

[tool.setuptools.package-dir]
"streetworld" = "streetworld"

[tool.setuptools.package-data]
"streetworld" = ["*", "**/*"]
"submodules.nurec_interface.nre.grpc.protos" = ["*.proto", "*.pyi"]
